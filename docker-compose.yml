version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eclipto-postgres
    restart: always
    environment:
      POSTGRES_USER: eclipto_admin
      POSTGRES_PASSWORD: eclipto_secret_password_2026
      POSTGRES_DB: eclipto_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eclipto_admin -d eclipto_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
